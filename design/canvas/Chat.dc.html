<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>hobbyl — повідомлення</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700;800&amp;family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--f-logo:'Unbounded',sans-serif;--f-head:'Golos Text',sans-serif;--f-wave:'Comfortaa',cursive;--f-body:'Onest',system-ui,sans-serif}
body{margin:0;background:#FFFFFF}
a{color:#2F6B4F}a:hover{color:#1F4D38}
button,input{font-family:inherit}
button{cursor:pointer}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
a,button,input,select,textarea,label{transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease,transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s ease}
a:hover,button:hover{transform:translateY(-1px)}
a:active,button:active{transform:translateY(0) scale(.98)}
:focus-visible{outline:3px solid rgba(47,107,79,.45);outline-offset:2px}
input[type=text]:focus,input[type=email]:focus,input[type=url]:focus,input[type=number]:focus,input[type=time]:focus,input[type=date]:focus,select:focus,textarea:focus{outline:none;border-color:#2F6B4F !important;box-shadow:0 0 0 4px rgba(47,107,79,.14)}
input[type=search]:focus{outline:none}
label:has(> input[type=search]:focus){border-color:#2F6B4F !important;box-shadow:0 0 0 4px rgba(47,107,79,.14)}
.dc-in{animation:dc-in .55s cubic-bezier(.2,.8,.2,1) both}
article{animation:dc-in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes dc-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
</style>
</helmet>
<div class="dc-in" style="min-height: 100vh; font-family: var(--f-body); color: #16241D; background: #F5F8F6">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 24px; background: #FFFFFF; border-bottom: 1px solid #DCE6DF">
    <a href="Landing.dc.html" aria-label="hobbyl — на головну" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #16241D">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 28 28"><path d="M14 2C8.5 2 4.5 6.2 4.5 11.4c0 6.6 7.6 13.2 8.9 14.3.4.3.9.3 1.2 0 1.3-1.1 8.9-7.7 8.9-14.3C23.5 6.2 19.5 2 14 2z" fill="#2F6B4F"></path><circle cx="14" cy="11.5" r="4" fill="#FFFFFF"></circle></svg>
      <span style="font-family: var(--f-logo); font-weight: 800; font-size: 23px; letter-spacing: -0.04em; line-height: 1">hobbyl</span>
    </a>
    <a href="Main.dc.html" style="font-size: 15px; font-weight: 700; text-decoration: none; color: #16241D">Карта</a>
    <a href="Cabinet.dc.html" style="margin-left: auto; font-size: 15px; font-weight: 700; text-decoration: none">← Мій кабінет</a>
  </header>

  <div style="max-width: 1200px; margin: 0 auto; padding: 28px 24px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-family: var(--f-head); font-size: 32px; font-weight: 800">Повідомлення</h1>
    <div style="display: flex; flex-wrap: wrap; align-items: stretch; gap: 16px">

      <nav aria-label="Розмови" style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 24px; background: #FFFFFF">
        <sc-for list="{{threads}}" as="t" hint-placeholder-count="3">
          <button type="button" onClick="{{t.open}}" aria-current="{{t.current}}" style="display: flex; align-items: center; gap: 12px; padding: 10px; border: 0; border-radius: 16px; background: {{t.bg}}; color: #16241D; text-align: left">
            <span aria-hidden="true" style="flex: 0 0 44px; height: 44px; border-radius: 50%; background: {{t.tint}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">{{t.ini}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 800">{{t.name}}</span><span style="font-size: 12px; color: #56665D">{{t.time}}</span></span>
              <span style="font-size: 13px; color: #56665D; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{t.preview}}</span>
            </span>
            <sc-if value="{{t.unread}}" hint-placeholder-val="{{false}}"><span aria-label="Нове" style="width: 10px; height: 10px; border-radius: 50%; background: #F0B23E"></span></sc-if>
          </button>
        </sc-for>
      </nav>

      <section aria-label="Розмова" style="flex: 999 1 520px; min-width: 0; min-height: 600px; display: flex; flex-direction: column; border-radius: 24px; background: #FFFFFF; overflow: hidden">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #DCE6DF">
          <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: {{cur.tint}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">{{cur.ini}}</span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">{{cur.name}}</span><span style="font-size: 13px; color: #56665D">{{cur.about}}</span></span>
          <a href="Event.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 999px; background: #E4EFE8; color: #1F4D38; text-decoration: none; font-size: 14px; font-weight: 700">Заняття</a>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #FBFCFB">
          <sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
            <div style="align-self: {{m.align}}; max-width: 72%; display: flex; flex-direction: column; gap: 3px; align-items: {{m.align}}">
              <span style="padding: 10px 14px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 15px; line-height: 1.45">{{m.text}}</span>
              <span style="font-size: 11px; color: #56665D">{{m.time}}</span>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 18px 0">
          <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
            <button type="button" onClick="{{q.use}}" style="height: 36px; padding: 0 12px; border: 1.5px solid #D3DED7; border-radius: 999px; background: #FFFFFF; color: #16241D; font-size: 13px; font-weight: 600">{{q.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px 18px 16px">
          <input type="text" aria-label="Повідомлення" placeholder="Напиши повідомлення…" value="{{draft}}" onChange="{{setDraft}}" style="flex: 1; min-width: 0; height: 48px; padding: 0 16px; border: 1.5px solid #D3DED7; border-radius: 999px; font-size: 15px; color: #16241D; outline: none">
          <button type="button" onClick="{{send}}" aria-label="Надіслати" style="width: 48px; height: 48px; border: 0; border-radius: 50%; background: #2F6B4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
        </div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = {
    open: 'olena',
    draft: '',
    sent: { olena: [], e4: [], ira: [] }
  };

  renderVals() {
    const s = this.state;
    const T = {
      olena: { name: 'Олена Ткач', ini: 'ОТ', tint: '#F4E4D4', about: 'Гончарство для новачків, сьогодні 19:00', time: '14:02', unread: true, msgs: [
        ['them', 'Вітаю, Оксано! Чекаю вас сьогодні о 19:00.', '13:40'],
        ['me', 'Дякую! Чи треба брати свій фартух?', '13:55'],
        ['them', 'Ні, фартух і всі інструменти дамо в студії. Тільки зручний одяг.', '14:02']
      ] },
      e4: { name: 'клуб «Е4»', ini: 'Е4', tint: '#ECEED6', about: 'Шахи у сквері, щодня', time: 'вчора', unread: true, msgs: [
        ['them', 'Привіт! У суботу турнір для новачків — приходьте.', 'вчора']
      ] },
      ira: { name: 'Ірина Бондар', ini: 'ІБ', tint: '#F5DFDF', about: 'Сальса: урок і вечірка', time: 'пн', unread: false, msgs: [
        ['me', 'Можна прийти без пари?', 'пн'],
        ['them', 'Звісно, ми міняємось партнерами кожні 5 хвилин.', 'пн']
      ] }
    };
    const cur = T[s.open];
    const all = cur.msgs.map((m) => ({ who: m[0], text: m[1], time: m[2] })).concat((s.sent[s.open] || []).map((t) => ({ who: 'me', text: t, time: 'щойно' })));
    const send = (text) => {
      const t = (text || '').trim();
      if (!t) return;
      this.setState({ draft: '', sent: Object.assign({}, s.sent, { [s.open]: (s.sent[s.open] || []).concat([t]) }) });
    };
    return {
      threads: Object.keys(T).map((id) => {
        const t = T[id];
        const mine = s.sent[id] || [];
        return { name: t.name, ini: t.ini, tint: t.tint, time: mine.length ? 'щойно' : t.time, unread: t.unread && id !== s.open, preview: mine.length ? 'Ви: ' + mine[mine.length - 1] : t.msgs[t.msgs.length - 1][1], current: id === s.open ? 'page' : 'false', bg: id === s.open ? '#E4EFE8' : 'transparent', open: () => this.setState({ open: id, draft: '' }) };
      }),
      cur,
      messages: all.map((m) => ({ text: m.text, time: m.time, align: m.who === 'me' ? 'flex-end' : 'flex-start', bg: m.who === 'me' ? '#2F6B4F' : '#FFFFFF', fg: m.who === 'me' ? '#FFFFFF' : '#16241D', radius: m.who === 'me' ? '18px 18px 4px 18px' : '18px 18px 18px 4px' })),
      quick: ['Дякую!', 'Буду вчасно', 'Можу запізнитися на 10 хв'].map((label) => ({ label, use: () => send(label) })),
      draft: s.draft,
      setDraft: (e) => this.setState({ draft: e.target.value }),
      send: () => send(s.draft)
    };
  }
}
</script>
</body>
</html>
