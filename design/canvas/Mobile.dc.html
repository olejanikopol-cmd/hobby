<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>hobbyl — головна на телефоні</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700;800&amp;family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--f-head:'Golos Text',sans-serif;--f-wave:'Comfortaa',cursive;--f-body:'Onest',system-ui,sans-serif}
body{margin:0;background:#FFFFFF}
a{color:#2F6B4F}a:hover{color:#1F4D38}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: var(--f-body); color: #16241D; background: #EEF4EF">

  <div aria-label="Карта Києва" style="position: absolute; left: 0; top: 0; width: 390px; height: 520px">
    <img src="/_blob/73e3e263376253f36736404bcaad95f9" alt="Карта Києва" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
      <button type="button" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}%; top: {{p.y}}%; transform: translate(-50%, -50%); min-width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
        <span style="display: block; padding: 6px 11px; border-radius: 999px; background: {{p.bg}}; color: {{p.fg}}; border: 2px solid {{p.ring}}; font-size: 13px; font-weight: 800; white-space: nowrap; box-shadow: 0 4px 12px rgba(22,36,29,0.18)">{{p.label}}</span>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 6px 0 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 16px rgba(22,36,29,0.12)">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 28 28"><path d="M14 2C8.5 2 4.5 6.2 4.5 11.4c0 6.6 7.6 13.2 8.9 14.3.4.3.9.3 1.2 0 1.3-1.1 8.9-7.7 8.9-14.3C23.5 6.2 19.5 2 14 2z" fill="#2F6B4F"></path><circle cx="14" cy="11.5" r="4" fill="#FFFFFF"></circle></svg>
      <input type="search" aria-label="Пошук хобі" placeholder="Шукати хобі в Києві" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; color: #16241D">
      <button type="button" aria-label="Мій профіль" style="width: 40px; height: 40px; border: 0; border-radius: 50%; background: #E4EFE8; color: #1F4D38; font-size: 14px; font-weight: 800">ОК</button>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button type="button" aria-pressed="{{c.on}}" style="flex: 0 0 auto; display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 700; box-shadow: 0 2px 8px rgba(22,36,29,0.10)">
          <sc-if value="{{c.live}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #F0B23E"></span></sc-if>
          <span>{{c.label}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <span style="position: absolute; right: 8px; top: 402px; padding: 1px 5px; border-radius: 5px; background: rgba(255,255,255,0.85); font-size: 9px; color: #3D4C44">© OpenFreeMap © OpenMapTiles © OpenStreetMap</span>

  <section aria-label="Список занять" style="position: absolute; left: 0; right: 0; top: 424px; bottom: 76px; padding: 10px 16px 0; border-radius: 24px 24px 0 0; background: #FFFFFF; box-shadow: 0 -8px 24px rgba(22,36,29,0.10); display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #D3DED7"></span>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-family: var(--f-head); font-size: 17px; font-weight: 700">Сьогодні в Києві</h1>
      <span style="font-size: 13px; font-weight: 600; color: #56665D">4 заняття</span>
    </div>
    <sc-for list="{{cards}}" as="it" hint-placeholder-count="3">
      <a href="Event.dc.html" style="display: flex; gap: 12px; padding: 10px; border-radius: 18px; border: 1.5px solid {{it.border}}; background: #FFFFFF; color: #16241D; text-decoration: none">
        <span aria-hidden="true" style="flex: 0 0 80px; height: 88px; border-radius: 12px; background: {{it.tint}}; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; font-family: var(--f-wave); font-size: 12px; font-weight: 700">{{it.cat}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px">
            <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: #2F6B4F">{{it.kind}}</span>
            <span style="padding: 2px 9px; border-radius: 999px; background: {{it.priceBg}}; color: {{it.priceFg}}; font-size: 13px; font-weight: 800; white-space: nowrap">{{it.price}}</span>
          </span>
          <span style="font-size: 15px; font-weight: 700; line-height: 1.3">{{it.title}}</span>
          <span style="font-size: 13px; color: #56665D">{{it.time}} {{it.place}}</span>
        </span>
      </a>
    </sc-for>
  </section>

  <nav aria-label="Головне меню" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; display: flex; justify-content: space-around; align-items: center; padding-bottom: 6px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #DCE6DF">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #2F6B4F; font-size: 12px; font-weight: 800">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>
      Карта
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #56665D; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
      Обране
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #56665D; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"></path></svg>
      Мої записи
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #56665D; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      Профіль
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const WHEN = [['now', 'Зараз'], ['today', 'Сьогодні'], ['tomorrow', 'Завтра'], ['weekend', 'Вихідні'], ['week', 'Тиждень'], ['always', 'Завжди']];
    return {
      chips: WHEN.map(([id, label]) => {
        const on = id === 'today';
        return { label, on, live: id === 'now', bg: on ? '#2F6B4F' : '#FFFFFF', fg: on ? '#FFFFFF' : '#16241D' };
      }),
      pins: [
        { label: '650 ₴', aria: 'Гончарство для новачків, 650 гривень', x: 26.7, y: 35.3, bg: '#2F6B4F', fg: '#FFFFFF', ring: '#FFFFFF' },
        { label: '150 ₴', aria: 'Вечір настільних ігор, 150 гривень', x: 10.2, y: 37.1, bg: '#FFFFFF', fg: '#16241D', ring: 'rgba(22,36,29,0.08)' },
        { label: 'Безкоштовно', aria: 'Шахи у сквері, безкоштовно', x: 25.9, y: 44.9, bg: '#E4EFE8', fg: '#1F4D38', ring: 'rgba(22,36,29,0.08)' },
        { label: '1400 ₴/міс', aria: 'Секція боксу, 1400 гривень на місяць', x: 86.2, y: 74.8, bg: '#FFFFFF', fg: '#16241D', ring: 'rgba(22,36,29,0.08)' }
      ],
      cards: [
        { title: 'Гончарство для новачків: перша чашка', kind: 'Майстер-клас', cat: 'Ремесла', tint: '#F4E4D4', price: '650 ₴', priceBg: '#F5F8F6', priceFg: '#16241D', time: '19:00', place: 'Поділ', border: '#2F6B4F' },
        { title: 'Шахи у сквері: грають усі охочі', kind: 'Клуб', cat: 'Ігри', tint: '#ECEED6', price: 'Безкоштовно', priceBg: '#E4EFE8', priceFg: '#1F4D38', time: '16:00–20:00', place: 'Золоті ворота', border: '#DCE6DF' },
        { title: 'Секція боксу для дорослих', kind: 'Секція', cat: 'Спорт', tint: '#DCEBE2', price: '1400 ₴/міс', priceBg: '#F5F8F6', priceFg: '#16241D', time: '19:30', place: 'Позняки', border: '#DCE6DF' }
      ]
    };
  }
}
</script>
</body>
</html>
