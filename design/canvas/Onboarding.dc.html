<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>hobbyl — онбординг</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700;800&amp;family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--f-head:'Golos Text',sans-serif;--f-wave:'Comfortaa',cursive;--f-body:'Onest',system-ui,sans-serif}
body{margin:0;background:#FFFFFF}
a{color:#2F6B4F}a:hover{color:#1F4D38}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 18px; font-family: var(--f-body); color: #16241D; background: #FFFFFF">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 700; color: #56665D">Крок 1 з 2</span>
    <div style="height: 6px; border-radius: 999px; background: #E4EFE8"><div style="width: 50%; height: 100%; border-radius: 999px; background: #2F6B4F"></div></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-family: var(--f-wave); font-size: 20px; font-weight: 700; color: #2F6B4F">Привіт!</span>
    <h1 style="margin: 0; font-family: var(--f-head); font-size: 30px; font-weight: 800; line-height: 1.15">Що тобі цікаво?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #56665D">Обери кілька — покажемо це першим на карті. Змінити можна будь-коли.</p>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{tags}}" as="t" hint-placeholder-count="16">
      <button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.on}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 700">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: #F5F8F6">
    <span style="font-size: 15px; font-weight: 800">Де шукати?</span>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border: 1.5px solid #D3DED7; border-radius: 14px; background: #FFFFFF; color: #16241D; font-size: 15px; font-weight: 700">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6B4F" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
      Поруч зі мною
    </button>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #56665D">
      або обери район
      <select style="height: 48px; padding: 0 12px; border: 1.5px solid #D3DED7; border-radius: 14px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #16241D">
        <option>Увесь Київ</option>
        <option>Поділ</option>
        <option>Печерськ</option>
        <option>Оболонь</option>
        <option>Позняки</option>
        <option>Лівобережна</option>
      </select>
    </label>
  </div>

  <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; font-weight: 600">
    <input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #2F6B4F">
    Я теж веду заняття — хочу сторінку ведучого
  </label>

  <div style="margin-top: auto; display: flex; gap: 10px">
    <a href="Main.dc.html" style="flex: 0 0 auto; display: flex; align-items: center; justify-content: center; height: 52px; padding: 0 20px; border-radius: 999px; color: #3D4C44; text-decoration: none; font-size: 16px; font-weight: 700">Пропустити</a>
    <a href="Main.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: #2F6B4F; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 800">Далі {{countLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { picked: ['Гончарство', 'Йога', 'Настільні ігри'] };

  renderVals() {
    const ALL = ['Гончарство', 'Бокс', 'Йога', 'Шахи', 'Сальса', 'Акварель', 'Біг', 'Настільні ігри', 'Столярка', 'Скелелазіння', 'Фото', 'Вокал', 'Кулінарія', 'Вишивка'];
    const picked = this.state.picked;
    return {
      tags: ALL.map((label) => {
        const on = picked.indexOf(label) !== -1;
        return {
          label, on,
          bg: on ? '#2F6B4F' : '#FFFFFF', fg: on ? '#FFFFFF' : '#16241D', bd: on ? '#2F6B4F' : '#D3DED7',
          toggle: () => this.setState({ picked: on ? picked.filter((p) => p !== label) : picked.concat([label]) })
        };
      }),
      countLabel: 'обрано ' + picked.length
    };
  }
}
</script>
</body>
</html>
